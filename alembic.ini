# Alembic configuration.
# NOTE: the DB URL is NOT hardcoded here. alembic/env.py injects it from the app
# config (core.config.Settings.database_url) so there is a single source of truth
# and migrations can never point at the wrong database.
# Keep this file ASCII-only: Alembic reads it via configparser using the system
# locale encoding (GBK on zh-CN Windows), which would choke on UTF-8 comments.

[alembic]
script_location = alembic
# Add project root to sys.path so env.py can import the core.* packages.
prepend_sys_path = .
# Timestamp-prefixed revision filenames for stable ordering.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
# Injected at runtime by env.py; left empty on purpose.
sqlalchemy.url =

[post_write_hooks]

# ---- logging ----
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
