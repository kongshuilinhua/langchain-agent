name: Lint & Test

on:
  push:
    branches: [master, new-version]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lingshu_agent_test
          POSTGRES_USER: lingshu
          POSTGRES_PASSWORD: lingshu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check api/ core/ tests/ --ignore=E501

      - name: Compile check
        run: python -m compileall api/ core/ -q

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://lingshu:lingshu@localhost:5432/lingshu_agent_test
          LINGSHU_MOCK_LLM: "true"
          LINGSHU_VECTOR_BACKEND: "memory"
          JWT_SECRET: test-secret-do-not-use-in-production
        run: python -m pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
